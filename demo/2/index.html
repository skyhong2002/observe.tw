<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-en="Demo 2 · Elpis — observe.tw">Demo 2 · Elpis — observe.tw</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;text y='.9em' font-size='90'&gt;🔭&lt;/text&gt;&lt;/svg&gt;">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Serif+TC:wght@500;700&display=swap">
<link rel="stylesheet" href="/demo/shared.css">
<style>
  :root {
    --bg: #f6f2e8;
    --surface: #fffdf8;
    --border: #e3dac6;
    --text: #1c2233;
    --text-dim: #4f5870;
    --text-faint: #8a8f9c;
    --accent: #2c5da8;
    --live: #2e8a57;
    --gold: #a8803a;
    --serif: "Cormorant Garamond", "Noto Serif TC", serif;
  }
  html { color-scheme: light; }
  body { background: var(--bg); }

  /* ---- hero ---- */
  .vista {
    height: min(64vh, 620px);
    background:
      linear-gradient(180deg, rgba(246, 242, 232, 0) 60%, var(--bg) 100%),
      url("/demo/assets/elpis.webp") center 40% / cover,
      linear-gradient(180deg, #8fb8e8, #f3d9cf);
  }
  header { padding: 0; background: none; margin-top: -120px; position: relative; }
  .plate {
    max-width: 680px;
    margin: 0 auto;
    padding: 40px 44px 36px;
    text-align: center;
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: 0 30px 60px -30px rgba(60, 50, 20, 0.25);
    position: relative;
  }
  .plate::before {
    content: "";
    position: absolute;
    inset: 7px;
    border: 1px solid rgba(168, 128, 58, 0.35);
    pointer-events: none;
  }
  .eyebrow {
    font-family: var(--serif);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.34em;
    color: var(--gold);
  }
  header h1 {
    margin-top: 8px;
    font-family: var(--serif);
    font-size: clamp(46px, 8vw, 72px);
    font-weight: 600;
    letter-spacing: 0;
    line-height: 1.05;
  }
  h1 .tld { color: var(--gold); }
  .tagline {
    margin: 16px auto 0;
    font-family: "Noto Serif TC", var(--serif);
    font-size: 16.5px;
    line-height: 1.9;
    color: var(--text-dim);
  }
  html[lang="en"] .tagline { font-family: var(--serif); font-size: 19.5px; line-height: 1.6; }
  .ornament { display: block; margin: 18px auto 0; width: 120px; color: var(--gold); }

  .topics { justify-content: center; margin-top: 36px; }
  .topics button { background: var(--surface); }
  .topics button:hover { border-color: #cdbf9f; }
  .topics button[aria-pressed="true"] { color: #fff; }
  .topics button[aria-pressed="true"] span { color: rgba(255, 255, 255, 0.7); }

  /* ---- islands ---- */
  .island { padding-top: 72px; }
  .island[hidden] { display: none; }
  .island-head { text-align: center; margin-bottom: 8px; }
  .island-head .no { font-family: var(--serif); font-size: 22px; color: var(--gold); }
  .island-head h2 { font-family: "Noto Serif TC", var(--serif); font-size: 30px; font-weight: 700; margin-top: 2px; }
  html[lang="en"] .island-head h2 { font-family: var(--serif); font-size: 36px; font-weight: 600; }
  .island-head p { max-width: 34em; margin: 8px auto 0; color: var(--text-dim); font-size: 15px; }

  .site h2 { font-family: "Noto Serif TC", var(--serif); }
  html[lang="en"] .site h2 { font-family: var(--serif); font-size: 30px; font-weight: 600; }
  .tags button { background: rgba(44, 93, 168, 0.07); }
  .plaque { border-radius: 0; background: var(--border); }
  .plaque > div { background: var(--surface); }
  .plaque dt { color: var(--gold); font-weight: 600; }
  .shot { border-radius: 4px; box-shadow: 0 24px 48px -28px rgba(60, 50, 20, 0.35); }
  a.shot:hover { border-color: #cdbf9f; }
  .shot-bar span { background: #e9e1cf; }
  .visit { color: #fff; border-radius: 3px; }
  ul.feats li::before { border-radius: 0; transform: rotate(45deg); background: var(--gold); }

  footer { text-align: center; }
  footer .credit { margin-top: 6px; font-size: 12.5px; }

  @media (max-width: 640px) {
    header { margin-top: -60px; }
    .plate { padding: 32px 22px 28px; }
  }
</style>
</head>
<body>
<div id="nav"></div>
<div class="vista" role="img" aria-label="浮在雲海上的花園群島" data-aria-en="Garden islands floating above a sea of clouds"></div>

<header>
  <div class="wrap">
    <div class="plate">
      <p class="eyebrow">ELPIS</p>
      <h1>observe<span class="tld">.tw</span></h1>
      <p class="tagline" id="tagline"></p>
      <svg class="ornament" viewBox="0 0 120 12" fill="none" stroke="currentColor" aria-hidden="true"><path d="M0 6h48M72 6h48"/><path d="M60 1l5 5-5 5-5-5z" fill="currentColor"/><circle cx="52" cy="6" r="1.5" fill="currentColor"/><circle cx="68" cy="6" r="1.5" fill="currentColor"/></svg>
    </div>
    <div id="topics"></div>
  </div>
</header>

<div class="wrap" id="islands"></div>

<div class="wrap">
  <footer>
    <div>🔭 observe.tw · Demo 2 · <a href="https://skyhong.tw">Sky Hong</a> · <a href="https://github.com/skyhong2002">GitHub</a></div>
    <p class="credit" data-en="A nod to Elpis and Hermes from Final Fantasy XIV. All artwork here is original.">致敬《Final Fantasy XIV》的 Elpis 與赫密士。頁面上的圖像皆為原創。</p>
  </footer>
</div>

<script type="module">
  import { CHAPTERS, byId, entryHTML, topicsHTML, wireFilter, loadPulse, t, DEMO_NAV } from '/demo/common.js';

  document.getElementById('nav').innerHTML = DEMO_NAV;
  document.getElementById('tagline').textContent = t(
    '一座培育觀測站的花園。每個觀測站都附一張紀錄：它觀測什麼、多久看一次、從何時開始、產出了什麼。',
    'A garden where observatories are grown. Each one carries a record: what it watches, how often, since when, and what it produces.',
  );

  const pulse = await loadPulse();
  document.getElementById('islands').innerHTML = CHAPTERS.map((c, i) => `
    <section class="island" id="ch-${c.id}">
      <div class="island-head">
        <span class="no">${['I', 'II', 'III', 'IV'][i]}</span>
        <h2>${c.title}</h2>
        <p>${c.lede}</p>
      </div>
      ${c.ids.map((id, j) => entryHTML(byId[id], { flip: j % 2 === 1, pulse })).join('')}
    </section>`).join('');

  document.getElementById('topics').innerHTML = topicsHTML();
  wireFilter({
    topics: document.querySelector('.topics'),
    sites: [...document.querySelectorAll('.site')],
    groups: [...document.querySelectorAll('.island')],
  });
</script>
</body>
</html>
